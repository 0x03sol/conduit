"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Meta {
  status: JSON
}

type Query {
  batch(id: String!): batch
  batchs(where: batchFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): batchPage!
  recipient(id: String!): recipient
  recipients(where: recipientFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): recipientPage!
  statusUpdate(id: String!): statusUpdate
  statusUpdates(where: statusUpdateFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): statusUpdatePage!
  _meta: Meta
}

type batch {
  id: String!
  sender: String!
  totalAmountSum: BigInt!
  recipientCount: Int!
  status: Int!
  registrationFee: BigInt
  createdBlock: BigInt!
  createdAt: BigInt!
  createdTxHash: String!
  settledBlock: BigInt
  settledAt: BigInt
  settledTxHash: String
  totalDistributed: BigInt
  recipients(where: recipientFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): recipientPage
  statusHistory(where: statusUpdateFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): statusUpdatePage
}

type recipientPage {
  items: [recipient!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type recipient {
  id: String!
  batchId: String!
  index: Int!
  wallet: String!
  amount: BigInt!
  outputCurrency: String!
  batch: batch
}

input recipientFilter {
  AND: [recipientFilter]
  OR: [recipientFilter]
  id: String
  id_not: String
  id_in: [String]
  id_not_in: [String]
  id_contains: String
  id_not_contains: String
  id_starts_with: String

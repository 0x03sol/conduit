  wallet_not_contains: String
  wallet_starts_with: String
  wallet_ends_with: String
  wallet_not_starts_with: String
  wallet_not_ends_with: String
  amount: BigInt
  amount_not: BigInt
  amount_in: [BigInt]
  amount_not_in: [BigInt]
  amount_gt: BigInt
  amount_lt: BigInt
  amount_gte: BigInt
  amount_lte: BigInt
  outputCurrency: String

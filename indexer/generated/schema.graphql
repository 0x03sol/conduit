  outputCurrency_starts_with: String
  outputCurrency_ends_with: String
  outputCurrency_not_starts_with: String
  outputCurrency_not_ends_with: String
}

type statusUpdatePage {
  items: [statusUpdate!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type statusUpdate {
  id: String!
  batchId: String!
  oldStatus: Int!
  newStatus: Int!
  block: BigInt!
  timestamp: BigInt!
